<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中国农业大学“耘思”大思政平台 - 角色入口选择</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* 引导页专属高级美学样式 */
        html, body.portal-body {
            background-color: #b81c22 !important;
            background: #b81c22 !important;
            margin: 0;
            padding: 0;
        }

        body.portal-body {
            min-height: 100vh;
            overflow-x: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .portal-container {
            width: 100%;
            min-height: 100vh;
            background-color: #b81c22 !important;
            background: #b81c22 !important;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .portal-container::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 10%, rgba(255, 215, 0, 0.12) 0%, rgba(0, 0, 0, 0) 65%);
            pointer-events: none;
            z-index: 2;
        }

        /* 红色流光背景动画 */
        .portal-container::before {
            content: "";
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.15) 0%, rgba(217, 45, 50, 0.1) 40%, rgba(0, 0, 0, 0) 70%);
            animation: rotateBg 20s linear infinite;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes rotateBg {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .portal-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 1100px;
            padding: 40px 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 50px;
        }

        /* 顶部品牌区 */
        .portal-logo-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            animation: fadeInDown 1s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .portal-logo-circle {
            width: 90px;
            height: 90px;
            background: #ffffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.2), 0 0 15px rgba(255, 215, 0, 0.4);
            border: 2px solid #ffd700;
            overflow: hidden;
        }

        .portal-logo-circle img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transform: scale(1.35);
        }

        .portal-title-group h1 {
            font-size: 2.5rem;
            color: #ffffff;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 8px;
            text-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        }

        .portal-title-group p {
            color: #ff999d;
            font-size: 1.1rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .portal-divider {
            width: 60px;
            height: 3px;
            background: #ffd700;
            margin-top: 15px;
            border-radius: 2px;
            box-shadow: 0 0 10px #ffd700;
        }

        /* 角色卡片网格 */
        .portal-cards-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
            width: 100%;
            animation: fadeInUp 1.2s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        @media (max-width: 900px) {
            .portal-cards-grid {
                grid-template-columns: 1fr;
                gap: 20px;
                max-width: 450px;
            }
        }

        /* 磨砂玻璃卡片 */
        .portal-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 40px 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 360px;
            text-decoration: none;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
        }

        /* 卡片金光扫过效果 */
        .portal-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(to right, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 0.05) 50%, rgba(255, 255, 255, 0) 100%);
            transform: skewX(-25deg);
            transition: 0.75s;
        }

        .portal-card:hover::before {
            left: 150%;
        }

        .portal-card:hover {
            transform: translateY(-10px);
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 215, 0, 0.5);
            box-shadow: 0 20px 40px rgba(166, 30, 34, 0.25), 0 0 25px rgba(255, 215, 0, 0.1);
        }

        .portal-card-icon-wrapper {
            width: 76px;
            height: 76px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 25px;
            transition: all 0.4s ease;
        }

        .portal-card:hover .portal-card-icon-wrapper {
            background: #a61e22;
            border-color: #ffd700;
            box-shadow: 0 0 20px rgba(166, 30, 34, 0.6);
            transform: scale(1.1);
        }

        .portal-card-icon-wrapper svg {
            width: 36px;
            height: 36px;
            fill: #ffb3b6;
            transition: all 0.4s ease;
        }

        .portal-card:hover .portal-card-icon-wrapper svg {
            fill: #ffd700;
        }

        .portal-card-info h3 {
            color: #ffffff;
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 12px;
            transition: all 0.3s;
        }

        .portal-card:hover .portal-card-info h3 {
            color: #ffd700;
        }

        .portal-card-info p {
            color: #a8a3a4;
            font-size: 0.9rem;
            line-height: 1.5;
            padding: 0 10px;
        }

        .portal-card-btn {
            margin-top: 25px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ffffff;
            padding: 10px 24px;
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 1px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.4s ease;
        }

        .portal-card:hover .portal-card-btn {
            background: #ffd700;
            color: #800000;
            border-color: #ffd700;
            box-shadow: 0 5px 15px rgba(255, 215, 0, 0.3);
        }

        .portal-card-btn svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
            transition: transform 0.3s;
        }

        .portal-card:hover .portal-card-btn svg {
            transform: translateX(4px);
        }

        /* 页面底部 */
        .portal-footer {
            font-size: 1rem;
            color: #ffd700;
            background: rgba(166, 30, 34, 0.15);
            border: 1px solid rgba(255, 215, 0, 0.5);
            padding: 15px 30px;
            border-radius: 12px;
            max-width: 800px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            animation: fadeIn 2s ease;
            display: inline-block;
            text-align: center;
        }

        .portal-footer p {
            margin: 0;
            line-height: 1.6;
        }

        .portal-footer .footer-warning-icon {
            color: #ffd700;
            margin-right: 5px;
            font-weight: bold;
        }

        /* 动画定义 */
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }
    </style>
</head>

        <!-- 页面底部声明 -->

</body>
